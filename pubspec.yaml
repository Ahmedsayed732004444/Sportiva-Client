name: sportiva_app
description: "Sportiva client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  intl: 0.20.2
  shared_preferences: ^2.5.5
  signalr_netcore: ^1.4.4
  geolocator: ^14.1.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.3
  video_player: ^2.11.1
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.1
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
